    <path d="M 145,445 C 165,432 185,452 170,455 C 158,458 152,448 162,442" 
          fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <path d="M 355,445 C 335,432 315,452 330,455 C 342,458 348,448 338,442" 

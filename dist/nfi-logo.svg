    <path d="M 250,42 C 308,105 372,193 381,253 C 390,307 365,328 365,390 C 365,442 326,460 250,460 C 174,460 135,442 135,390 C 135,328 110,307 119,253 C 128,193 192,105 250,42 Z" 

    <circle cx="250" cy="80" r="4" fill="#FFFFFF" />
    <circle cx="282" cy="102" r="3.5" fill="#FFFFFF" />
    <circle cx="218" cy="102" r="3.5" fill="#FFFFFF" />
    <circle cx="312" cy="135" r="4" fill="#FFFFFF" />
    <circle cx="188" cy="135" r="4" fill="#FFFFFF" />
    <circle cx="338" cy="180" r="4.5" fill="#FFFFFF" />
    <circle cx="162" cy="180" r="4.5" fill="#FFFFFF" />

    <!-- Bold Serif Typography "NFI" -->
